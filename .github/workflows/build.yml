name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run DSP and UI tests
        run: |
          cmake -S tests -B build/tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build/tests -j
          ctest --test-dir build/tests --output-on-failure
      - name: Cross-check two-plane solver against pyPRB
        run: |
          pip install pyPRB
          python3 tools/crosscheck_pyprb.py build/tests/balance_cli 300

  ui-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tap through a whole job with the demo wheel and render every screen
        run: |
          pip install pillow
          PYTHON=python3 sh tools/ui_sim/run.sh shots
      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: shots/

  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {config: balancer-tire.yaml, name: balancer-tire}
          - {config: balancer-tire-demo.yaml, name: balancer-tire-demo}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache ESPHome toolchains
        uses: actions/cache@v4
        with:
          path: ~/.cache/esphome
          key: esphome-2026.9.1-${{ runner.os }}
      - name: Install ESPHome
        run: pip install esphome==2026.9.1
      - name: Compile
        run: |
          cp ci/secrets.yaml secrets.yaml
          set +e
          esphome compile ${{ matrix.config }} 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ]; then
            # Surface compiler errors as annotations (readable through the API).
            grep -E "error:|Error |undefined reference|ERROR" build.log | head -40 > errors.txt
            python3 - <<'PY'
          import pathlib
          lines = pathlib.Path("errors.txt").read_text(errors="replace").splitlines()
          for chunk in [lines[i:i + 8] for i in range(0, len(lines), 8)][:6]:
              msg = "%0A".join(l.replace("%", "%25").replace("::", ": :")[:400] for l in chunk)
              print(f"::error title=compile::{msg}")
          PY
          fi
          exit $status
      - name: Collect firmware
        run: |
          mkdir -p out
          find . -path '*/.esphome/build/*/.pioenvs/*/firmware*.bin' -o -path '*/.esphome/build/*/build/*.bin' | head -20
          find . -name 'firmware.factory.bin' -o -name 'firmware.ota.bin' | xargs -I{} cp {} out/ || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.name }}
          path: out/
          if-no-files-found: warn
      - name: Publish to the 'latest' pre-release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --prerelease --title "Latest build" --notes "Built automatically from main."
          for f in out/*.bin; do
            cp "$f" "${{ matrix.name }}.$(basename "$f" | sed 's/^firmware\.//')"
            gh release upload latest "${{ matrix.name }}.$(basename "$f" | sed 's/^firmware\.//')" --clobber
          done
