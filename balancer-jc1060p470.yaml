# P4 Balancer firmware for the Guition JC1060P470C (ESP32-P4, 7" 1024x600).
# Real sensors: two IEPE accelerometers via PCM1808 on JP1, tach on GPIO32.
# For a bench demo without the front end, flash balancer-demo.yaml instead.
substitutions:
  name: balancer
  friendly_name: Balancer
  simulate: "false"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  project:
    name: "clowrey.p4-balancer"
    version: "0.1.0"
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 70%

external_components:
  - source:
      type: local
      path: components
    components: [balancer]

packages:
  hardware: !include hardware_guition_jc1060p470.yaml

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

lvgl:
  displays: my_display
  touchscreens: my_touchscreen
  buffer_size: 25%
  byte_order: little_endian
  bg_color: 0x0f1419
  widgets:
    - label:
        text: "Starting balancer..."
        align: CENTER
        text_color: 0xe6edf3

# See docs/hardware/pinout.md for the JP1 header.
balancer:
  id: rotor_balancer
  simulate: ${simulate}
  i2s:
    mclk_pin: GPIO1
    bclk_pin: GPIO2
    lrclk_pin: GPIO3
    din_pin: GPIO4
    sample_rate: 16000
  tach:
    pin: GPIO32
    edge: RISING
    pullup: true
  channel_a:
    sensitivity: 100   # mV/g, from the sensor's cal sheet (editable on the screen)
    gain: 10
  channel_b:
    sensitivity: 100
    gain: 10
  rpm:
    name: "Rotor speed"
  amplitude_a:
    name: "Bearing A 1x"
  amplitude_b:
    name: "Bearing B 1x"
  phase_a:
    name: "Bearing A phase"
  phase_b:
    name: "Bearing B phase"
