# Shared by the balancer firmware for the Guition JC1060P470C: board,
# network, display and the local component. The including file supplies the
# substitutions (name, friendly_name) and its own `balancer:` block.
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  project:
    name: "clowrey.esp32-wheel-balancer"
    version: "0.1.0"
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: display_backlight
          brightness: 70%

external_components:
  - source:
      type: local
      path: components
    components: [balancer]

packages:
  hardware: !include hardware_guition_jc1060p470.yaml

# The raw stream to a PC (LIVE screen "PC log", tools/mpu_log.py) logs about
# 50 lines a second from the acquisition task; give that task's log buffer
# room for a slow UI redraw.
logger:
  task_log_buffer_size: 8192

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  # A balancer runs standalone: never restart because Wi-Fi or Home Assistant
  # is missing (the default reboots after 15 min and would lose a run).
  reboot_timeout: 0s
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

lvgl:
  displays: my_display
  touchscreens: my_touchscreen
  buffer_size: 25%
  byte_order: little_endian
  bg_color: 0x0f1419
  widgets:
    - label:
        text: "Starting balancer..."
        align: CENTER
        text_color: 0xe6edf3
